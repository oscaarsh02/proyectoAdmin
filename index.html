<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Institucional</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>

<div class="header-institucional text-white text-center">
    <div class="overlay">
        <img src="https://scontent.fpbc1-1.fna.fbcdn.net/v/t39.30808-6/475837968_1140139717899868_8435360732712652367_n.jpg?_nc_cat=102&ccb=1-7&_nc_sid=2a1932&_nc_ohc=Apf_YoEsSwAQ7kNvwGGlORb&_nc_oc=Adnnv1FAN6IjZ17eez406iNGtdcFafhLBs28UClNEQVm2MeqJLBV56V8_jYRTQvlMWw&_nc_zt=23&_nc_ht=scontent.fpbc1-1.fna&_nc_gid=tnBEuy4Zvosnq5nJvtHRSQ&oh=00_AfvzoxSFF1mMUuaIG5jHeCXBt_ql95c15I8MhjAWE6brGw&oe=699D0FE3" class="logo">
        <h1>Sistema Institucional de Asistencias</h1>
        <p>Control y monitoreo académico</p>
    </div>
</div>

<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">Sistema Institucional de Asistencias</span>
</nav>

<div class="row mb-4">
    <div class="col-md-4">
        <div class="card text-center shadow">
            <div class="card-body">
                <h6>Total Registros</h6>
                <h2 id="total"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center shadow">
            <div class="card-body">
                <h6>% Asistencia</h6>
                <h2 class="text-success" id="asistencia"></h2>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center shadow">
            <div class="card-body">
                <h6>% Falta</h6>
                <h2 class="text-danger" id="falta"></h2>
            </div>
        </div>
    </div>
</div>


    <div class="card shadow p-4 mb-4">
        <div id="grafica"></div>
    </div>
    <div class="mb-4">
        <label class="form-label"><strong>Seleccionar Profesor:</strong></label>
        <select class="form-select" id="selectorProfesor">
            <option value="todos">Todos</option>
        </select>
    </div>


    <div class="card shadow p-4">
        <h5>Resumen por Profesor</h5>
        <table class="table table-striped mt-3" id="tablaProfesores">
            <thead>
                <tr>
                    <th>Profesor</th>
                    <th>Puntual</th>
                    <th>Tolerancia</th>                  
                    <th>Falta</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
