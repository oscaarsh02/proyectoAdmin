<!DOCTYPE html>
<html>
<head>
    <title>Dashboard Institucional</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">Sistema Institucional de Asistencias</span>
</nav>

<div class="container mt-4">

    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h6>Total Registros</h6>
                    <h2 id="total"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h6>% Asistencia</h6>
                    <h2 class="text-success" id="asistencia"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h6>% Retardo</h6>
                    <h2 class="text-warning" id="retardo"></h2>
                </div>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card text-center shadow">
                <div class="card-body">
                    <h6>% Falta</h6>
                    <h2 class="text-danger" id="falta"></h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow p-4 mb-4">
        <div id="grafica"></div>
    </div>

    <div class="card shadow p-4">
        <h5>Resumen por Profesor</h5>
        <table class="table table-striped mt-3" id="tablaProfesores">
            <thead>
                <tr>
                    <th>Profesor</th>
                    <th>Puntual</th>
                    <th>Tolerancia</th>
                    <th>Retardo</th>
                    <th>Falta</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
