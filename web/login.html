<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login | Sistema Institucional</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Barra institucional -->
    <header class="top-header">
        <h2>Sistema Institucional de Control de Asistencias</h2>
    </header>

    <!-- Contenedor principal -->
    <main class="login-main">
        <div class="login-card">
            
            <img src="assets/img/logo_de_la_BUAP.png" class="logo">
            <h1 class="titulo">Facultad de administración</h1>
            <p class="subtitulo">Control y Gestión Mensual</p>

            <div class="input-group">
                <input type="text" id="usuario" placeholder="Usuario">
            </div>

            <div class="input-group password-group">
                <input type="password" id="password" placeholder="Contraseña">
                <span class="toggle-password" onclick="togglePassword()">👁</span>
            </div>

            <button class="btn-primary" onclick="login()">Ingresar</button>

            <p id="error" class="error"></p>

            <button class="btn-link" onclick="volverInicio()">← Volver al inicio</button>

        </div>
    </main>

    <footer class="footer">
        © 2026 Sistema Institucional | Todos los derechos reservados
    </footer>

    <script src="js/auth.js"></script>
</body>
</html>
